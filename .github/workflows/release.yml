name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # @napi-rs/canvas ships one npm package per platform+arch (e.g. @napi-rs/canvas-darwin-arm64),
      # and npm's optional-dependency resolution only installs the ONE matching the machine `npm ci`
      # ran on. But electron-builder's mac target here packages BOTH x64 and arm64 from this single
      # runner -- so whichever arch doesn't match this runner ships with no native binding at all,
      # and the app throws "Cannot find native binding" at startup on that arch. Force-install both
      # darwin variants (at the version @napi-rs/canvas itself resolved to) so both mac targets get
      # a working binary regardless of which arch this runner happens to be.
      - name: Ensure both macOS canvas native bindings are present
        if: matrix.os == 'macos-latest'
        run: |
          CANVAS_VERSION=$(node -p "require('./node_modules/@napi-rs/canvas/package.json').version")
          npm install --no-save --force "@napi-rs/canvas-darwin-x64@$CANVAS_VERSION" "@napi-rs/canvas-darwin-arm64@$CANVAS_VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # electron-builder packages only here -- it does NOT publish. Publishing is deliberately not
      # done per-OS: running `--publish` concurrently across the matrix means each platform's
      # electron-builder process independently races to create/manage the same GitHub Release,
      # and whichever finishes first "locks" it -- every other platform's upload then gets silently
      # skipped with "existing type not compatible with publishing type". Building artifacts here and
      # publishing them all in one place (the `publish` job below) avoids that race entirely.
      - name: Package
        run: npm run ${{ matrix.script }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-studio-${{ matrix.os }}
          # *.yml (latest.yml / latest-linux.yml) and *.blockmap are electron-updater's own
          # update-metadata files -- electron-builder writes them alongside the installers whenever
          # a `publish` config exists (it does, see package.json), regardless of --publish never.
          # Without them, electron-updater has nothing to compare against and never finds an update.
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' -o -name '*.blockmap' \) -exec cp {} out/ \;
          ls -la out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
